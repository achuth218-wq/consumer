name: Konnect AI Gateway consumer

on:
  pull_request:
    branches: [main]
    paths: ['konnect/consumer.yaml']

  push:
    branches: [main]
    paths: ['konnect/consumer.yaml']

  workflow_dispatch:
    inputs:
      target:
        description: Environment to preview or deploy
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - dev
          - test
          - prod

permissions:
  contents: read
  pull-requests: write

jobs:
  configure:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       startsWith(github.ref, 'refs/heads/'))

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || '["sandbox","dev","test","prod"]') }}

    name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'Deploy' || 'Preview' }} consumers / ${{ matrix.target }}
    runs-on: ubuntu-latest

    # Deployment jobs use the target environment and its approval rules.
    # PR and feature-branch jobs use a read-only preview environment.
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.target || 'konnect-preview' }}

    concurrency:
      # The policy workflow must use the same konnect-apply-{target} group.
      group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('konnect-apply-{0}', matrix.target) || format('konnect-consumer-preview-{0}-{1}', github.ref, matrix.target) }}
      queue: max

    defaults:
      run:
        shell: bash

    env:
      KONGCTL_DEFAULT_KONNECT_REGION: ${{ vars.KONNECT_REGION || 'in' }}
      AI_GATEWAY_ID: ${{ vars[format('{0}_AI_GATEWAY_ID', matrix.target)] }}
      TARGET_ENV: ${{ matrix.target }}
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'true' || 'false' }}
      NO_COLOR: '1'

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install kongctl
        uses: kong/setup-kongctl@v1
        with:
          kongctl-version: '1.28.1'

      - name: Check deployment revision
        if: env.DEPLOY == 'true'
        run: |
          if ! git diff --quiet HEAD origin/main -- \
              konnect/consumer.yaml \
              .github/workflows/konnect-consumer.yaml \
              memberships.py; then
            echo "::error::Consumer deployment files have changed on main. Start a new run."
            exit 1
          fi

      - name: Validate selected gateway and consumer manifest
        id: validate
        run: |
          if [[ "$KONGCTL_DEFAULT_KONNECT_REGION" != "in" ]]; then
            echo "::error::Set KONNECT_REGION to in for the India gateways."
            exit 1
          fi

          if [[ -z "$AI_GATEWAY_ID" ]]; then
            echo "::error::Set the ${TARGET_ENV^^}_AI_GATEWAY_ID repository variable."
            exit 1
          fi

          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          from uuid import UUID

          import yaml

          class Loader(yaml.SafeLoader):
              pass

          Loader.add_constructor(
              "!env",
              lambda loader, node: ("env", loader.construct_scalar(node)),
          )

          try:
              UUID(os.environ["AI_GATEWAY_ID"])
          except ValueError:
              raise SystemExit("AI_GATEWAY_ID must be a valid gateway UUID")

          manifest = yaml.load(Path("konnect/consumer.yaml").read_text(), Loader=Loader)
          expected = [{"ref": "target", "_external": {"id": ("env", "AI_GATEWAY_ID")}}]
          if manifest.get("ai_gateways") != expected:
              raise SystemExit("Use a single external gateway target with id: !env AI_GATEWAY_ID")
          PY

          echo "Environment: $TARGET_ENV"
          echo "India gateway: $AI_GATEWAY_ID"
          echo "Commit: $GITHUB_SHA"
          echo "Deployment enabled: $DEPLOY"

      - name: Plan | Generate consumer plan
        id: consumer_plan
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets[env.DEPLOY == 'true' && 'KONNECT_DEPLOY_TOKEN' || 'KONNECT_PREVIEW_TOKEN'] }}
        run: |
          if [[ -z "$KONGCTL_DEFAULT_KONNECT_PAT" ]]; then
            if [[ "$DEPLOY" == "true" ]]; then
              echo "::error::Set KONNECT_DEPLOY_TOKEN in the $TARGET_ENV GitHub environment."
            else
              echo "::error::Set KONNECT_PREVIEW_TOKEN in the konnect-preview GitHub environment."
            fi
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Planning consumer changes for $TARGET_ENV (attempt $attempt of 3)"

            if kongctl plan --region in --mode apply \
                -f konnect/consumer.yaml \
                --output-file "$RUNNER_TEMP/plan.json" \
                2>"$RUNNER_TEMP/plan.err"; then
              cat "$RUNNER_TEMP/plan.err" >&2
              break
            else
              status=$?
            fi

            cat "$RUNNER_TEMP/plan.err" >&2

            if [[ "$attempt" == 3 ]] || ! grep -Fq 'TLS handshake timeout' "$RUNNER_TEMP/plan.err"; then
              echo "::error::Consumer planning failed for $TARGET_ENV (exit $status)."
              exit "$status"
            fi

            echo "::warning::TLS handshake timed out. Retrying in $((attempt * 5)) seconds."
            sleep "$((attempt * 5))"
          done

          count=$(jq -r '(.changes // []) | length' "$RUNNER_TEMP/plan.json")
          echo "Planned resource changes: $count"
          echo "resource_count=$count" >> "$GITHUB_OUTPUT"

      - name: Plan | Show consumer resource diff
        id: plan_diff
        run: |
          kongctl diff --plan "$RUNNER_TEMP/plan.json" -o text \
            > "$RUNNER_TEMP/diff.txt"

          echo "::group::Consumer resource diff for $TARGET_ENV"
          cat "$RUNNER_TEMP/diff.txt"
          echo "::endgroup::"

          {
            echo "### Consumer plan — $TARGET_ENV"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/diff.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan | Preview individual memberships
        id: membership_preview
        env:
          KONNECT_TOKEN: ${{ secrets[env.DEPLOY == 'true' && 'KONNECT_DEPLOY_TOKEN' || 'KONNECT_PREVIEW_TOKEN'] }}
        run: |
          echo "Checking consumer group assignments on $TARGET_ENV"
          /usr/bin/python3 -u ./memberships.py preview | tee "$RUNNER_TEMP/membership.txt"

          {
            echo "### Membership preview — $TARGET_ENV"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/membership.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Format pull request comment
        if: github.event_name == 'pull_request'
        run: |
          {
            cat "$RUNNER_TEMP/diff.txt"
            printf '\nMembership changes\n'
            cat "$RUNNER_TEMP/membership.txt"
          } > "$RUNNER_TEMP/preview.txt"

          {
            echo "### Konnect consumer diff — $TARGET_ENV"
            echo
            head -c 8000 "$RUNNER_TEMP/preview.txt" | sed 's/^/    /'
            if (( $(wc -c < "$RUNNER_TEMP/preview.txt") > 8000 )); then
              printf '\n\nSee the Actions summary for the complete diff.\n'
            fi
          } > "$RUNNER_TEMP/comment.md"

      - name: Post consumer diff on the pull request
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: konnect-consumer-${{ matrix.target }}
          path: ${{ runner.temp }}/comment.md

      - name: Plan | Check consumer deployment scope
        id: scope_check
        run: |
          jq -e '
            (.changes // []) |
            type == "array" and
            all(.[]; .resource_type == "ai_gateway_consumer" and .action == "CREATE")
          ' "$RUNNER_TEMP/plan.json" > /dev/null || {
            echo "::error::The plan includes changes outside consumer creation. Review the diff."
            exit 1
          }

          echo "Consumer deployment scope check passed for $TARGET_ENV."

      - name: Apply | Deploy consumer configuration
        id: consumer_apply
        if: env.DEPLOY == 'true'
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_DEPLOY_TOKEN }}
        run: |
          echo "Applying saved consumer plan to $TARGET_ENV"
          echo "Gateway: $AI_GATEWAY_ID"
          echo "Commit: $GITHUB_SHA"

          kongctl apply --region in \
            --plan "$RUNNER_TEMP/plan.json" \
            --auto-approve -o text

          echo "Consumer apply completed successfully for $TARGET_ENV."

      - name: Apply | Reconcile individual memberships
        id: membership_apply
        if: env.DEPLOY == 'true'
        env:
          KONNECT_TOKEN: ${{ secrets.KONNECT_DEPLOY_TOKEN }}
        run: |
          echo "Reconciling consumer group assignments on $TARGET_ENV"
          /usr/bin/python3 -u ./memberships.py apply
          echo "Membership apply completed successfully for $TARGET_ENV."

      - name: Report plan and apply results
        if: always()
        env:
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
          PLAN_RESULT: ${{ steps.consumer_plan.outcome }}
          RESOURCE_COUNT: ${{ steps.consumer_plan.outputs.resource_count }}
          DIFF_RESULT: ${{ steps.plan_diff.outcome }}
          PREVIEW_RESULT: ${{ steps.membership_preview.outcome }}
          SCOPE_RESULT: ${{ steps.scope_check.outcome }}
          APPLY_RESULT: ${{ steps.consumer_apply.outcome }}
          MEMBERSHIP_RESULT: ${{ steps.membership_apply.outcome }}
        run: |
          {
            echo "### Consumer workflow results — $TARGET_ENV"
            echo
            echo "Planned resource changes: ${RESOURCE_COUNT:-unavailable}"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validate gateway and manifest | $VALIDATION_RESULT |"
            echo "| Generate consumer plan | $PLAN_RESULT |"
            echo "| Show consumer diff | $DIFF_RESULT |"
            echo "| Preview memberships | $PREVIEW_RESULT |"
            echo "| Check deployment scope | $SCOPE_RESULT |"
            echo "| Apply consumers | $APPLY_RESULT |"
            echo "| Apply memberships | $MEMBERSHIP_RESULT |"

            if [[ "$DEPLOY" == "false" ]]; then
              echo
              echo "Read-only preview. Both apply stages are skipped."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
