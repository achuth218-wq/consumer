name: Konnect AI Gateway policy

on:
  pull_request:
    branches: [main]
    paths: ['konnect/policy.yaml']

  push:
    branches: [main]
    paths: ['konnect/policy.yaml']

  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - dev
          - test
          - prod

      list_gateways_only:
        description: List visible India AI gateways without deploying
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  configure:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || '["sandbox","dev","test","prod"]') }}

    name: policy / ${{ matrix.target }}
    runs-on: ubuntu-latest

    environment: ${{ (github.event_name == 'pull_request' || inputs.list_gateways_only) && 'konnect-preview' || matrix.target }}

    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('konnect-policy-pr-{0}-{1}', github.event.number, matrix.target) || format('konnect-apply-{0}', matrix.target) }}
      queue: max

    defaults:
      run:
        shell: bash

    env:
      NO_COLOR: '1'
      KONGCTL_DEFAULT_KONNECT_REGION: in
      AI_GATEWAY_ID: ${{ vars[format('{0}_AI_GATEWAY_ID', matrix.target)] }}

    steps:
      - uses: kong/setup-kongctl@v1
        with:
          kongctl-version: '1.28.1'

      - name: List visible India gateways
        if: inputs.list_gateways_only
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_PREVIEW_TOKEN }}
        run: kongctl list ai-gateways --region in --text-id-format full

      - uses: actions/checkout@v4
        if: ${{ !inputs.list_gateways_only }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check approved revision
        if: github.event_name != 'pull_request' && !inputs.list_gateways_only
        run: |
          if ! git diff --quiet HEAD origin/main -- \
              konnect/policy.yaml .github/workflows/konnect-policy.yaml; then
            echo "::error::Policy deployment files have changed on main. Start a new run on main."
            exit 1
          fi

      - name: Check target gateway reference
        if: ${{ !inputs.list_gateways_only }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          from uuid import UUID
          import yaml

          class Loader(yaml.SafeLoader):
              pass

          Loader.add_constructor("!env", lambda loader, node: ("env", loader.construct_scalar(node)))
          Loader.add_constructor("!ref", lambda loader, node: loader.construct_scalar(node))

          UUID(os.environ["AI_GATEWAY_ID"])
          config = yaml.load(Path("konnect/policy.yaml").read_text(), Loader=Loader)
          expected = [{"ref": "target", "_external": {"id": ("env", "AI_GATEWAY_ID")}}]
          if config.get("ai_gateways") != expected:
              raise SystemExit("Set the external gateway target to id: !env AI_GATEWAY_ID")
          PY

      - name: Plan policy changes against live Konnect
        if: ${{ !inputs.list_gateways_only }}
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets[github.event_name == 'pull_request' && 'KONNECT_PREVIEW_TOKEN' || 'KONNECT_DEPLOY_TOKEN'] }}
        run: |
          : "${KONGCTL_DEFAULT_KONNECT_PAT:?Set the Konnect token for this GitHub environment}"

          for attempt in 1 2 3; do
            if kongctl plan --region in --mode apply \
                -f konnect/policy.yaml \
                --output-file "$RUNNER_TEMP/plan.json" \
                2>"$RUNNER_TEMP/plan.err"; then
              cat "$RUNNER_TEMP/plan.err" >&2
              break
            else
              status=$?
            fi

            cat "$RUNNER_TEMP/plan.err" >&2
            if [[ "$attempt" == 3 ]] || ! grep -Fq 'TLS handshake timeout' "$RUNNER_TEMP/plan.err"; then
              exit "$status"
            fi

            echo "::warning::TLS handshake timed out. Retrying in $((attempt * 5)) seconds."
            sleep "$((attempt * 5))"
          done

      - name: Format pull request diff
        if: github.event_name == 'pull_request'
        run: |
          kongctl diff --plan "$RUNNER_TEMP/plan.json" -o text > "$RUNNER_TEMP/diff.txt"
          {
            echo "### Konnect policy diff — ${{ matrix.target }}"
            echo
            head -c 8000 "$RUNNER_TEMP/diff.txt" | sed 's/^/    /'
            if (( $(wc -c < "$RUNNER_TEMP/diff.txt") > 8000 )); then
              echo
              echo "See the workflow summary for the full diff."
            fi
          } > "$RUNNER_TEMP/comment.md"
          sed 's/^/    /' "$RUNNER_TEMP/diff.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Post policy diff
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: konnect-policy-${{ matrix.target }}
          path: ${{ runner.temp }}/comment.md

      - name: Check policy deployment scope
        if: ${{ !inputs.list_gateways_only }}
        run: |
          jq -e '
            ((.changes // []) | type == "array") and
            all(.changes[]?;
              (.resource_type == "ai_gateway_policy" or .resource_type == "ai_gateway_consumer_group") and
              (.action == "CREATE" or .action == "UPDATE") and
              ((.fields // {}) | has("consumers") | not) and
              ((.changed_fields // {}) | has("consumers") | not))
          ' "$RUNNER_TEMP/plan.json" > /dev/null || {
            echo "::error::Plan exceeds the policy workflow scope."
            exit 1
          }

      - name: Apply policy configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.list_gateways_only
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_DEPLOY_TOKEN }}
        run: kongctl apply --region in --plan "$RUNNER_TEMP/plan.json" --auto-approve -o text
